name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript + web assets
        run: npm run build

      - name: Build standalone client (Node SEA)
        run: npm run client

      - name: Build desktop launcher (C# / .NET Framework)
        run: npm run desktop

      - name: Typecheck
        run: npm run typecheck

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "build/SakuraCode.exe", "build/SakuraCode Desktop.exe" `
            -DestinationPath "build/SakuraCode-$version-win-x64.zip" -Force
          Write-Host "Packaged build/SakuraCode-$version-win-x64.zip"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create $tag `
            "build/SakuraCode.exe" `
            "build/SakuraCode Desktop.exe" `
            "build/SakuraCode-$version-win-x64.zip" `
            --title "SakuraCode $tag" `
            --notes "Windows x64 桌面包。SakuraCode.exe 是内置引擎的独立可执行文件； SakuraCode Desktop.exe 是系统 Chrome / Edge 应用模式的启动器。双击运行需要系统 .NET Framework 4.8 与 Chrome 或 Edge；无需 Node/npm。" `
            --verify-tag
